[project]
name = "staff-matching-local"
version = "0.1.0"
description = "Local-only synthetic staffing optimization demonstration"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "ortools>=9.12,<10",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=25,<26",
  "webauthn>=2,<3",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
